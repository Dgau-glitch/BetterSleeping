# This workflow will build a Java project with Maven and run Folia migration guardrails.

name: Build status

on:
  push:
    branches: [ v3.0.0 ]
  pull_request:
    branches: [ v3.0.0 ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: Run unit tests
      run: mvn -B test --file pom.xml
    - name: Package without tests
      run: mvn -B -DskipTests package --file pom.xml
    - name: Guard against legacy scheduler usage
      run: |
        ! rg -n "BukkitRunnable|BukkitScheduler|runTaskTimer|org\.bukkit\.scheduler" src/main/java
        ! rg -n "Thread\.sleep|runTaskAsynchronously" src/main/java/be/betterplugins/bettersleeping/animation
